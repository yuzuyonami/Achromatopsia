name: Update repo list

on:
  push:
    paths:
      - ".gitmodules"
      - ".github/repo-descriptions.toml"
      - ".github/scripts/update_readme.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate table from .gitmodules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .github/repo-descriptions.toml
          git diff --cached --quiet && exit 0
          git commit -m "docs: update repository list"
          git pull --rebase
          git push
